<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>No carrier — Hey It's Burt</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07090c">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .lost {
      min-height: 100svh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 48px 28px 80px;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(212, 138, 74, 0.12), transparent 50%),
        var(--bg);
    }
    .lost .code {
      font-family: "JetBrains Mono", monospace;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--phosphor);
      margin: 0 0 18px;
    }
    .lost h1 {
      font-family: "Bowlby One", sans-serif;
      font-size: clamp(48px, 12vw, 120px);
      line-height: 0.85;
      margin: 0 0 18px;
      text-shadow: 0.045em 0.045em 0 var(--orange);
    }
    .lost p {
      max-width: 460px;
      margin: 0 auto 32px;
      color: var(--muted);
      font-size: 18px;
    }
  </style>
</head>
<body>
  <main class="lost">
    <div>
      <p class="code">404 · NO CARRIER</p>
      <h1>Signal lost.</h1>
      <p>That frequency is empty. Tune back to the listening post and try again.</p>
      <a class="btn primary" href="/">Return to station</a>
    </div>
  </main>
</body>
</html>
